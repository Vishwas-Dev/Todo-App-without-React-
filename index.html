<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="index.css" />
    <title>Todo-App</title>
  </head>
  <body>
    <!-- Todo-app starts from here -->
    <div class="todo-app">
      <!-- todo-card -->
      <div class="todo-container">
        <!-- todo heading -->
        <header>
          <div class="title text-center pt-4">
            <h1>To Do App</h1>
          </div>
        </header>

        <!-- todo 1st row(inputs and btns) -->
        <div class="row-1 d-flex flex-row pt-4 justify-content-center">
          <input
            type="text"
            class="form-control"
            placeholder="Enter a task here" />
          <button class="btn-save btn btn-primary" type="submit">SAVE</button>
          <button class="btn-gettasks btn btn-warning" type="submit">
            GET TASKS
          </button>
        </div>

        <!-- todo-data -->
        <div class="row-2" id="todo-data">
          <div class="list-todo-heading d-flex justify-content-between">
            <div class="todo-no">No.</div>
            <div class="todo-item">Todo Item</div>
            <div class="todo-status">Status</div>
            <div class="todo-actions">Actions</div>
          </div>
          <hr />
          <div id="row-data">
            <div class="list-todo-data d-flex">
              <div class="todo-no-data">1</div>
              <div class="todo-item-data">today i will open books</div>
              <div class="todo-status-data">in Progress...</div>
              <div class="todo-actions-data">
                <button class="btn btn-danger fw-medium">Delete</button>
                <button class="btn btn-success fw-medium">Finished</button>
              </div>
            </div>
          </div>
          <hr />
          <!-- <div class="list-todo-data d-flex ">
            <div class="todo-no-data">2</div>
            <div class="todo-item-data">will play video games for 2 hours</div>
            <div class="todo-status-data">Completed</div>
            <div class="todo-actions-data">
              <button class="btn btn-danger fw-medium">Delete</button>
              <button class="btn btn-success fw-medium">Finished</button>
            </div>
          </div>
          <hr>
          <div class="list-todo-data d-flex ">
            <div class="todo-no-data">3</div>
            <div class="todo-item-data">walk/running</div>
            <div class="todo-status-data">in Progress...</div>
            <div class="todo-actions-data">
              <button class="btn btn-danger fw-medium">Delete</button>
              <button class="btn btn-success fw-medium">Finished</button>
            </div>
          </div>
          <hr> -->
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"></script>
    <script src="index.js"></script>
  </body>
</html>
